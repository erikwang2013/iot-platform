[package]
name = "iot-access"
version = "0.1.0"
edition = "2024"

[dependencies]
ecat = { path = "../ecat" }
ecat-transport-http.workspace = true
ecat-data-sqlx = { path = "../ecat-data-sqlx" }
ecat-data = { path = "../ecat-data" }
ecat-middleware = { path = "../ecat-middleware" }
ecat-iot = { path = "../ecat-iot" }
ecat-health = { path = "../ecat-health" }
ecat-data-redis = { path = "../ecat-data-redis" }
ecat-mq = { path = "../ecat-mq" }
ecat-mq-kafka = { path = "../ecat-mq-kafka" }
ecat-mq-mqtt = { path = "../ecat-mq-mqtt" }
axum.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
reqwest = { version = "0.12", features = ["json"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2.workspace = true
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tower-util = "0.3"
tower.workspace = true
