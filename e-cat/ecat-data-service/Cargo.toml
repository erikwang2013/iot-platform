[package]
name = "ecat-data-service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iot-data"
path = "src/main.rs"

[dependencies]
ecat = { path = "../ecat" }
ecat-data = { path = "../ecat-data" }
ecat-middleware = { path = "../ecat-middleware" }
ecat-iot = { path = "../ecat-iot" }
ecat-health = { path = "../ecat-health" }
ecat-transport-http.workspace = true
ecat-data-tdengine = { path = "../ecat-data-tdengine" }
ecat-mq = { path = "../ecat-mq" }
ecat-mq-kafka = { path = "../ecat-mq-kafka" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
futures-util = "0.3"
rust_xlsxwriter = "0.99"

[dev-dependencies]
tower.workspace = true
