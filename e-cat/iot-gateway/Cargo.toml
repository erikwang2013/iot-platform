[package]
name = "iot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
ecat = { path = "../ecat" }
ecat-auth.workspace = true
ecat-transport-http.workspace = true
ecat-health = { path = "../ecat-health" }
ecat-security = { path = "../ecat-security" }
