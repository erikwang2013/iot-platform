[package]
name = "ecat-rule"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iot-rule"
path = "src/main.rs"

[dependencies]
ecat = { path = "../ecat" }
ecat-transport-http.workspace = true
ecat-data = { path = "../ecat-data" }
ecat-search = { path = "../ecat-search" }
ecat-data-sqlx = { path = "../ecat-data-sqlx" }
ecat-middleware = { path = "../ecat-middleware" }
ecat-iot = { path = "../ecat-iot" }
ecat-health = { path = "../ecat-health" }
ecat-mq = { path = "../ecat-mq" }
ecat-mq-kafka = { path = "../ecat-mq-kafka" }
ecat-auth = { path = "../ecat-auth" }
axum = { workspace = true, features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }

[dev-dependencies]
tower-util = "0.3"
tower.workspace = true
jsonwebtoken = "9"
