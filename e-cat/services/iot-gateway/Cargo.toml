[package]
name = "iot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
ecat = { path = "../../ecat" }
ecat-auth = { path = "../../ecat-auth" }
ecat-transport-http = { path = "../../ecat-transport-http" }
# 外部依赖：security-rust 需克隆 https://github.com/erikwang2013/security-rust
# 到 /home/wwwroot/erikwang2013/security-rust（P6 部署文档给出 CI 拉取方案）
security-rust = { path = "/home/wwwroot/erikwang2013/security-rust" }
axum = "0.8"
tower = "0.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
jsonwebtoken = "9"
tower-util = "0.3"
