[package]
name = "iot-device"
version = "0.1.0"
edition = "2024"

[dependencies]
ecat = { path = "../../ecat" }
ecat-transport-http = { path = "../../ecat-transport-http" }
ecat-data-sqlx = { path = "../../ecat-data-sqlx" }
ecat-data = { path = "../../ecat-data" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
