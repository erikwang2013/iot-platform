[package]
name = "ecat-device"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iot-device"
path = "src/main.rs"

[dependencies]
ecat = { path = "../ecat" }
ecat-transport-http.workspace = true
ecat-data-sqlx = { path = "../ecat-data-sqlx" }
ecat-health = { path = "../ecat-health" }
ecat-middleware = { path = "../ecat-middleware" }
ecat-data = { path = "../ecat-data" }
ecat-search = { path = "../ecat-search" }
ecat-metrics.workspace = true
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[dev-dependencies]
tower.workspace = true
