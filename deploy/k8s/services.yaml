# 六业务服务 Deployment + Service（镜像统一 Dockerfile 构建，见 deploy/docker/Dockerfile）。
# 水平扩展：改 replicas 即可（多实例语义见 docs/deploy/multi-instance.md）。
# HPA 预留：`kubectl autoscale deployment iot-gateway --cpu-percent=70 --min=1 --max=5`
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: iot-gateway, namespace: iot }
spec:
  replicas: 1
  selector: { matchLabels: { app: iot-gateway } }
  template:
    metadata: { labels: { app: iot-gateway } }
    spec:
      containers:
        - name: gateway
          image: iot-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: iot-config }
            - secretRef: { name: iot-secrets }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: iot-gateway, namespace: iot }
spec:
  selector: { app: iot-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
