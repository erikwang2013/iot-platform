# 生产部署务必替换全部占位值（kubectl create secret 或 sealed-secrets）。
apiVersion: v1
kind: Secret
metadata:
  name: iot-secrets
  namespace: iot
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_jwt_secret_at_least_32_bytes"
  IOT_GATEWAY_SECRET: "CHANGE_ME_gateway_secret"
  IOT_PASSWORD_PEPPER: "CHANGE_ME_password_pepper"
  IOT_CRED_ENCRYPT_KEY: "CHANGE_ME_encrypt_key"
