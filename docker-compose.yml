services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: iot
      MYSQL_USER: iot
      MYSQL_PASSWORD: iot
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uiot", "-piot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  emqx:
    image: emqx/emqx:5.8
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "18083:18083"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/bitnami/kafka

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: iot
      MINIO_ROOT_PASSWORD: iot-password
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  tdengine:
    image: tdengine/tdengine:3.3
    ports:
      - "${TDENGINE_PORT:-6041}:6041"


# ===== 业务服务（本地全栈一键起：docker compose --profile app up -d --build）=====
  # 镜像经 deploy/docker/Dockerfile 多阶段构建（release 二进制，无源码）。
  # .env 提供密钥（JWT_SECRET 等），容器内地址经 environment 显式覆盖为服务名。
  iot-gateway:
    image: iot-gateway:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-gateway }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "mysql://iot:iot@mysql:3306/iot"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "8080:8080"
    depends_on: [mysql, redis]

  iot-device:
    image: iot-device:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-device }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "mysql://iot:iot@mysql:3306/iot"
    ports:
      - "8081:8081"
    depends_on: [mysql]

  iot-access:
    image: iot-access:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-access }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "mysql://iot:iot@mysql:3306/iot"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      MQTT_URL: "tcp://emqx:1883"
      ACCESS_CALLBACK_BASE: "http://localhost:8080/api/access/oauth/callback"
    ports:
      - "8082:8082"
    depends_on: [mysql, redis, kafka, emqx]

  iot-rule:
    image: iot-rule:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-rule }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "mysql://iot:iot@mysql:3306/iot"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "8084:8084"
    depends_on: [mysql, redis, kafka]

  iot-data:
    image: iot-data:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-data }
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BROKERS: "kafka:9092"
      TDENGINE_URL: "http://tdengine:6041"
      TDENGINE_USER: "root"
      TDENGINE_PASS: "taosdata"
    ports:
      - "8083:8083"
    depends_on: [kafka, tdengine]

  iot-cdn:
    image: iot-cdn:local
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args: { BIN: iot-cdn }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "mysql://iot:iot@mysql:3306/iot"
    ports:
      - "8085:8085"
    depends_on: [mysql]

volumes:
  mysqldata:
  kafkadata:
  miniodata:
