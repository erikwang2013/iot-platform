    <text x="116" y="111" font-size="11" fill="#475569">security-rust — 27개 감지기 · 주입 · XSS · 프로토콜 공격 · 민감 데이터 유출</text>
  </g>
  <line x1="560" y1="124" x2="560" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

