    <text x="560" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Echtzeit-Push</text>
    <text x="560" y="481" text-anchor="middle" font-size="11" fill="#475569">WebSocket-Push an den Client</text>
  </g>
