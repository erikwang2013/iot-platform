<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="340" fill="#fbfbfd"/>

  <text x="560" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Siklus Hidup Perangkat</text>

  <!-- 主链 -->
  <g>
    <rect x="30" y="120" width="130" height="66" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="95" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Daftar</text>
    <text x="95" y="165" text-anchor="middle" font-size="10.5" fill="#475569">On-boarding</text>

    <rect x="190" y="120" width="130" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="255" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Aktifkan</text>
    <text x="255" y="165" text-anchor="middle" font-size="10.5" fill="#475569">Aktif</text>

    <rect x="350" y="120" width="130" height="66" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <text x="415" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Nonaktifkan</text>
    <text x="415" y="165" text-anchor="middle" font-size="10.5" fill="#475569">Ditangguhkan</text>

    <rect x="510" y="120" width="130" height="66" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="575" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Lepas Tautan</text>
    <text x="575" y="165" text-anchor="middle" font-size="10.5" fill="#475569">Terlepas</text>

    <rect x="670" y="120" width="130" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="735" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Hapus</text>
    <text x="735" y="165" text-anchor="middle" font-size="10.5" fill="#475569">Dihapus</text>
  </g>
  <line x1="160" y1="153" x2="188" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="153" x2="348" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="322" y1="147" x2="346" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-rev)"/>
  <line x1="480" y1="153" x2="508" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="153" x2="668" y2="153" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 运行时状态 -->
  <text x="30" y="256" font-size="10.5" font-style="italic" fill="#64748b">Runtime</text>
  <text x="30" y="270" font-size="10.5" font-style="italic" fill="#64748b">Status:</text>
  <g>
    <rect x="150" y="230" width="130" height="66" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="215" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Online</text>
    <text x="215" y="275" text-anchor="middle" font-size="10.5" fill="#475569">Terhubung</text>

    <rect x="330" y="230" width="130" height="66" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="395" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Offline</text>
    <text x="395" y="275" text-anchor="middle" font-size="10.5" fill="#475569">Terputus</text>
  </g>
  <line x1="282" y1="263" x2="328" y2="263" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="284" y1="257" x2="326" y2="257" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-rev)"/>
  <line x1="255" y1="186" x2="215" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="213" y1="230" x2="253" y2="188" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="560" y="318" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">Operasi siklus hidup: aktifkan · nonaktifkan · lepas tautan · hapus — online/offline adalah status runtime saat aktif</text>

  <text x="560" y="330" text-anchor="middle" font-size="26" font-weight="bold" fill="#94a3b8" opacity="0.35" transform="rotate(-20 560 330)">https://erik.xyz</text>
  <text x="1100" y="328" text-anchor="end" font-size="12" fill="#64748b" opacity="0.55">https://erik.xyz</text>
</svg>
