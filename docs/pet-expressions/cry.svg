<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="IoT Bot · 哭 Cry"><title>IoT Bot · 哭 Cry</title><desc>IoT Bot 的 哭 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sob 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
