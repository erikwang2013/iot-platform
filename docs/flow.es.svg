<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#fbfbfd"/>

  <text x="560" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Flujos de acceso de dispositivos</text>

  <!-- 列 A：云对云接入 -->
  <text x="200" y="56" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="2" fill="#2563eb">ACCESO NUBE A NUBE</text>
  <g>
    <rect x="40" y="70" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Autorización OAuth del inquilino</text>
    <text x="200" y="114" text-anchor="middle" font-size="11" fill="#475569">Autorización de cuenta del fabricante</text>

    <rect x="40" y="160" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">El adaptador obtiene dispositivos</text>
    <text x="200" y="204" text-anchor="middle" font-size="11" fill="#475569">Vía OpenAPI del fabricante</text>

    <rect x="40" y="250" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Registro · modelo de cosas unificado</text>
    <text x="200" y="294" text-anchor="middle" font-size="11" fill="#475569">Servicio iot-device</text>

    <rect x="40" y="340" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Suscribirse a webhooks del fabricante</text>
    <text x="200" y="384" text-anchor="middle" font-size="11" fill="#475569">Callbacks de propiedades · eventos</text>

    <rect x="40" y="430" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Eventos → Kafka</text>
    <text x="200" y="474" text-anchor="middle" font-size="11" fill="#475569">iot-data → TDengine</text>

    <rect x="40" y="520" width="320" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Push WebSocket al frontend</text>
  </g>
  <line x1="200" y1="134" x2="200" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="224" x2="200" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="314" x2="200" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="404" x2="200" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="494" x2="200" y2="518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列 B：直连 MQTT -->
  <text x="560" y="56" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="2" fill="#7c3aed">ACCESO MQTT DIRECTO</text>
  <g>
    <rect x="400" y="70" width="320" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="560" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">MQTT del dispositivo → EMQX</text>
    <text x="560" y="114" text-anchor="middle" font-size="11" fill="#475569">mTLS · certificados de cliente</text>

    <rect x="400" y="160" width="320" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="560" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">iot-access consume eventos</text>
    <text x="560" y="204" text-anchor="middle" font-size="11" fill="#475569">Flujo de eventos</text>

    <rect x="400" y="250" width="320" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="560" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Shadow del dispositivo (Redis)</text>
    <text x="560" y="294" text-anchor="middle" font-size="11" fill="#475569">Estado en tiempo real</text>

    <rect x="400" y="340" width="320" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="560" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Eventos → Kafka</text>
    <text x="560" y="384" text-anchor="middle" font-size="11" fill="#475569">Almacenamiento de series temporales</text>

    <rect x="400" y="430" width="320" height="64" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="560" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Push en tiempo real</text>
    <text x="560" y="481" text-anchor="middle" font-size="11" fill="#475569">Push WebSocket al cliente</text>
  </g>
  <line x1="560" y1="134" x2="560" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="224" x2="560" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="314" x2="560" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="404" x2="560" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列 C：指令下发 -->
  <text x="920" y="56" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="2" fill="#16a34a">ENTREGA DE COMANDOS</text>
  <g>
    <rect x="760" y="70" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="920" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Acción del frontend</text>
    <text x="920" y="114" text-anchor="middle" font-size="11" fill="#475569">Clic · formulario · automatización</text>

    <rect x="760" y="160" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="920" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">iot-gateway</text>
    <text x="920" y="204" text-anchor="middle" font-size="11" fill="#475569">JWT · RBAC · escaneo de entrada</text>

    <rect x="760" y="250" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="920" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">iot-device</text>
    <text x="920" y="294" text-anchor="middle" font-size="11" fill="#475569">Validación de comandos</text>

    <rect x="760" y="340" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="920" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Adaptador / EMQX</text>
    <text x="920" y="384" text-anchor="middle" font-size="11" fill="#475569">Enrutar al destino</text>

    <rect x="760" y="430" width="320" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="920" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">OpenAPI del fabricante / MQTT</text>
    <text x="920" y="474" text-anchor="middle" font-size="11" fill="#475569">El dispositivo ejecuta</text>
  </g>
  <line x1="920" y1="134" x2="920" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="224" x2="920" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="314" x2="920" y2="338" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="404" x2="920" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="560" y="606" text-anchor="middle" font-size="26" font-weight="bold" fill="#94a3b8" opacity="0.35" transform="rotate(-20 560 606)">https://erik.xyz</text>
  <text x="1100" y="606" text-anchor="end" font-size="12" fill="#64748b" opacity="0.55">https://erik.xyz</text>
</svg>
