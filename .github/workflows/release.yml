# 发布流水线（C-4）：main 合并后构建 6 个业务镜像推送 GHCR，打版本标签。
# 替代本地 git hook（scripts/release.sh）的发布职责。
# 前置：仓库 Settings → Secrets 无需额外配置（使用 GITHUB_TOKEN 推 GHCR）；
#       镜像仓库需为 public 或给 CI 配置包读取权限。
name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/iot
  SERVICES: iot-gateway iot-device iot-access iot-rule iot-data iot-cdn

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号：取最近 tag 增量 minor（与 scripts/release.sh 语义对齐）
      - name: Compute version
        id: version
        run: |
          latest=$(git tag --sort=-v:refname | head -1 || echo "v0.0.0")
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "tag=v${major}.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      # 逐服务构建推送（共享缓存，避免一次性 6 镜像构建内存爆炸）
      - name: Build & push all services
        run: |
          set -e
          for bin in ${{ env.SERVICES }}; do
            image="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${bin}"
            docker buildx build \
              -f deploy/docker/Dockerfile \
              --build-arg BIN=${bin} \
              --platform linux/amd64 \
              -t "${image}:latest" \
              -t "${image}:${{ steps.version.outputs.tag }}" \
              --cache-from=type=gha --cache-to=type=gha,mode=max \
              --push .
          done

      - name: Create git tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
